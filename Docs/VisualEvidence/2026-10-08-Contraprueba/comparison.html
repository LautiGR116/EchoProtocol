<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Protocol · Contraprueba</title><style>body{margin:0;background:#101916;color:#e0e4dc;font:16px system-ui}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:32px;font-weight:500;margin:0 0 12px}p{max-width:950px;color:#b8c6bb;line-height:1.6}nav{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}button{background:#20342b;color:#dce5d9;border:1px solid #506b5b;border-radius:4px;padding:12px 18px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#e0c797;color:#18221b}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;display:block;border:1px solid #374a3e}figcaption{padding:12px 0;color:#c7d2c9}a{color:#b7d3c2}@media(max-width:850px){.pair{grid-template-columns:1fr}}.note{border-left:2px solid #b89b61;padding-left:16px;margin-top:22px}</style><main><h1>Contraprueba</h1><p>Del corredor de dos recepciones a un circuito que obliga a regresar. Capturas del juego desde la cámara real del Player; encuadres distintos porque cambió la arquitectura. No hay retoque ni renders promocionales.</p><nav id="tabs"></nav><div class="pair"><figure><img id="before"><figcaption id="before-label">Reconstruction · base preservada</figcaption></figure><figure><img id="after"><figcaption id="after-label">Contraprueba · campaña integrada</figcaption></figure></div><p class="note" id="caption"></p><p><a href="../../CONTRAPRUEBA_CANDIDATE.md">Informe, recorrido de evaluación y límites</a></p></main><script>const views=[['Recepción A','before-P3/02-A-accepted-0-Game.png','campaign-native-final/campaign-Contraprueba-first-presence-Game.png','La primera aceptación abre el paso técnico y baja una persiana física. Las placas dejan libre el rostro.'],['Separación','before-P3/03-opaque-transfer-0-Game.png','campaign-native-final/campaign-Contraprueba-separation-Game.png','Un desvío entre salas sustituye la línea recta. Se pierde de vista al Echo mientras se recorre la instalación.'],['El regreso','before-P3/04-B-accepted-0-Game.png','campaign-native-final/campaign-Contraprueba-close-return-Game.png','B transfiere el circuito. La ventilación se detiene y una luz doméstica revela lo que ya estaba detrás del vidrio. El mando final recibe la segunda presencia real en A.'],['Salida','before-P3/05-secured-exit-Game.png','campaign-native-final/campaign-05-R3-unlocked-Game.png','La contraprueba conserva la apertura; terminar la reproducción no obliga a correr. La salida conecta con el archivo de la campaña.'],['Cuerpo en movimiento','candidate-echo/06-moving-next-recorded-phase-Game.png','final-echo/06-moving-next-recorded-phase-Game.png','Corrección detectada al recorrer: la primera transferencia de pesos estiraba ropa hacia las manos. La versión final conserva pesos por topología; ambas imágenes son reproducciones de movimiento real, con fases y encuadres distintos.','Primera articulación · defecto conservado como evidencia','Articulación final · pesos corregidos']];const before=document.getElementById('before'),after=document.getElementById('after'),caption=document.getElementById('caption'),tabs=document.getElementById('tabs');function show(i){before.src=views[i][1];before.alt='Vista original: '+views[i][0];after.src=views[i][2];after.alt='Vista nueva: '+views[i][0];caption.textContent=views[i][3];document.getElementById('before-label').textContent=views[i][4]||'Reconstruction · base preservada';document.getElementById('after-label').textContent=views[i][5]||'Contraprueba · campaña integrada';document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));}views.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v[0];b.onclick=()=>show(i);tabs.append(b)});show(0);</script>
